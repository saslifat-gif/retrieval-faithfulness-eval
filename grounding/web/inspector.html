<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Grounding Inspector</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "outline-variant": "#c7c4d8", "surface-container-highest": "#e1e3e4",
          "surface-container-low": "#f3f4f5", "primary": "#3525cd", "on-primary": "#ffffff",
          "surface": "#f8f9fa", "surface-container-high": "#e7e8e9", "tertiary": "#95002b",
          "on-primary-container": "#dad7ff", "surface-container-lowest": "#ffffff",
          "surface-container": "#edeeef", "primary-fixed": "#e2dfff", "primary-container": "#4f46e5",
          "on-primary-fixed": "#002113", "on-secondary": "#ffffff", "surface-variant": "#e1e3e4",
          "secondary": "#006c49", "on-background": "#191c1d", "on-surface-variant": "#464555",
          "error-container": "#ffdad6", "error": "#ba1a1a", "on-error": "#ffffff",
          "on-error-container": "#93000a", "outline": "#777587", "on-surface": "#191c1d",
          "background": "#f8f9fa"
        },
        borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        spacing: { "base": "4px", "xs": "4px", "md": "16px", "sm": "8px", "lg": "24px",
                   "gutter": "20px", "container-max": "1440px", "xl": "32px" },
        fontFamily: { "display-lg": ["Inter"], "code-md": ["JetBrains Mono"], "body-sm": ["Inter"],
                      "body-md": ["Inter"], "headline-md": ["Inter"], "label-caps": ["Inter"],
                      "code-sm": ["JetBrains Mono"] },
        fontSize: {
          "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
          "code-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
          "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
          "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
          "code-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
        }
      } }
    }
  </script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e1e3e4; border-radius: 10px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3525cd; cursor: pointer; margin-top: -6px; }
    input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #e5e7eb; border-radius: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-surface text-on-surface">
<!-- TopNavBar -->
<header class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-lg py-md max-w-container-max mx-auto">
<div class="flex flex-col">
<h1 class="text-headline-md font-headline-md font-bold text-on-surface">Grounding Inspector</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Is the answer grounded in the retrieved evidence?</p>
</div>
<nav class="hidden md:flex gap-xl items-center">
<a class="text-primary font-bold border-b-2 border-primary pb-2 text-body-md" href="/">Inspector</a>
<a class="text-on-surface-variant pb-2 hover:text-primary transition-colors text-body-md" href="/benchmarks">Benchmarks</a>
</nav>
<button id="loadExample" class="text-primary font-bold text-body-md hover:opacity-80 transition-all">Load Example</button>
</div>
</header>

<main class="max-w-container-max mx-auto px-lg py-xl">
<div class="grid grid-cols-12 gap-lg">
<!-- LEFT: Inputs -->
<section class="col-span-12 lg:col-span-5 flex flex-col gap-lg">
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant">QUESTION</label>
<input id="question" class="w-full bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary text-body-md px-md py-sm" type="text" placeholder="What did the user ask?"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant">RETRIEVED DOCUMENTS</label>
<textarea id="documents" class="w-full bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary text-code-md p-md leading-relaxed whitespace-pre-line custom-scrollbar" rows="5" placeholder="One document per paragraph (separate with a blank line)."></textarea>
<p class="text-[10px] text-on-surface-variant">One document per paragraph — separate with a blank line.</p>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant">RESPONSE TO VALIDATE</label>
<textarea id="response" class="w-full bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary text-body-md p-md leading-relaxed" rows="3" placeholder="The RAG answer to check, sentence by sentence."></textarea>
</div>
</div>
<!-- Controls -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-lg shadow-sm">
<div class="grid grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant">METHOD</label>
<div class="relative">
<select id="method" class="w-full appearance-none bg-surface-container-low border-none rounded-lg text-body-sm py-sm pl-md pr-xl focus:ring-2 focus:ring-primary cursor-pointer">
<option value="lexical" selected>Lexical (fuzzy overlap)</option>
<option value="embedding">Embedding (cosine)</option>
<option value="nli">NLI (entailment)</option>
<option value="hhem">HHEM (faithfulness)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
<p id="methodHint" class="text-[10px] text-on-surface-variant mt-1">Lexical is instant &amp; offline.</p>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant">GRANULARITY</label>
<div class="flex bg-surface-container-low p-1 rounded-lg" id="granularity" data-value="sentence">
<button data-gran="sentence" class="gran-btn flex-1 bg-surface-container-lowest text-primary font-bold py-1.5 rounded-md text-label-caps font-label-caps shadow-sm">Sentence</button>
<button data-gran="response" class="gran-btn flex-1 text-on-surface-variant py-1.5 rounded-md text-label-caps font-label-caps hover:text-on-surface transition-colors">Response</button>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="text-label-caps font-label-caps text-on-surface-variant">SUPPORT THRESHOLD</label>
<span id="thresholdVal" class="font-code-md text-code-md text-primary font-bold">75</span>
</div>
<input id="threshold" class="w-full appearance-none h-1 rounded-lg bg-surface-container-high accent-primary" max="100" min="0" type="range" value="75"/>
</div>
<button id="checkBtn" class="w-full bg-primary text-on-primary py-md rounded-lg font-bold hover:opacity-90 transition-all flex items-center justify-center gap-sm disabled:opacity-50">
<span class="material-symbols-outlined">analytics</span> Check grounding
</button>
</div>
</section>
<!-- RIGHT: Results -->
<section class="col-span-12 lg:col-span-7 flex flex-col gap-lg" id="results"></section>
</div>
</main>

<script>
  const EXAMPLE = {
    question: "Where is the Eiffel Tower?",
    documents: "The Eiffel Tower is located in Paris, France.\n\nThe Eiffel Tower was completed in 1889.",
    response: "The Eiffel Tower is located in Paris. It is 450 meters tall."
  };
  const METHOD_HINTS = {
    lexical: "Lexical is instant & offline.",
    embedding: "Embedding downloads a model on first use (first run is slow).",
    nli: "NLI downloads a model on first use (first run is slow).",
    hhem: "HHEM downloads a model on first use (first run is slow)."
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Load example
  $("loadExample").onclick = () => {
    $("question").value = EXAMPLE.question;
    $("documents").value = EXAMPLE.documents;
    $("response").value = EXAMPLE.response;
  };
  // Threshold label
  $("threshold").addEventListener("input", e => $("thresholdVal").textContent = e.target.value);
  // Method hint
  $("method").addEventListener("change", e => $("methodHint").textContent = METHOD_HINTS[e.target.value]);
  // Granularity toggle
  document.querySelectorAll(".gran-btn").forEach(btn => btn.onclick = () => {
    $("granularity").dataset.value = btn.dataset.gran;
    document.querySelectorAll(".gran-btn").forEach(b => {
      const on = b === btn;
      b.className = "gran-btn flex-1 py-1.5 rounded-md text-label-caps font-label-caps " +
        (on ? "bg-surface-container-lowest text-primary font-bold shadow-sm"
            : "text-on-surface-variant hover:text-on-surface transition-colors");
    });
  });

  const resultsEl = $("results");
  const initialState = () => `
    <div class="flex-1 min-h-[420px] border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center text-center p-lg">
      <div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center mb-md">
        <span class="material-symbols-outlined text-primary text-3xl">fact_check</span>
      </div>
      <p class="text-headline-md font-headline-md text-on-surface mb-xs">No results yet</p>
      <p class="text-body-md text-on-surface-variant max-w-xs">Configure your inputs and click "Check grounding" to see the sentence-by-sentence breakdown.</p>
    </div>`;
  const loadingState = (msg) => `
    <div class="bg-surface-container-low rounded-xl h-20 skeleton"></div>
    <div class="flex flex-col items-center justify-center py-lg gap-sm">
      <span class="material-symbols-outlined spinner text-primary text-3xl">progress_activity</span>
      <p class="text-body-md text-on-surface font-medium">Analyzing grounding…</p>
      <p class="text-body-sm text-on-surface-variant">${esc(msg)}</p>
    </div>
    <div class="bg-surface-container-low rounded-xl h-24 skeleton"></div>
    <div class="bg-surface-container-low rounded-xl h-24 skeleton"></div>`;
  const errorState = (msg) => `
    <div class="bg-error-container border border-error/20 rounded-xl p-lg flex items-center gap-md">
      <span class="material-symbols-outlined text-error">error</span>
      <p class="text-body-md text-on-error-container">${esc(msg)}</p>
    </div>`;

  function banner(d) {
    const isResp = d.granularity === "response";
    if (d.grounded) {
      return `<div class="bg-[#e7f5ed] border border-secondary/20 rounded-xl p-lg flex items-start gap-md">
        <div class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-on-secondary shrink-0">
          <span class="material-symbols-outlined">check</span></div>
        <div class="flex flex-col gap-xs">
          <div class="flex items-center gap-sm">
            <h3 class="text-headline-md font-headline-md text-secondary font-bold">GROUNDED</h3>
            <span class="px-sm py-0.5 rounded-full bg-secondary text-on-secondary text-label-caps font-label-caps">VERIFIED</span>
          </div>
          <p class="text-body-md text-[#00513a]">${isResp ? "Whole response supported" : `All ${d.sentence_count} sentence(s) supported`} · support
            <span class="font-code-md font-bold">${d.weakest_score} / 100</span></p>
        </div></div>`;
    }
    return `<div class="bg-error-container border border-error/20 rounded-xl p-lg flex items-start gap-md">
      <div class="w-10 h-10 rounded-full bg-error flex items-center justify-center text-on-error shrink-0">
        <span class="material-symbols-outlined">close</span></div>
      <div class="flex flex-col gap-xs">
        <div class="flex items-center gap-sm">
          <h3 class="text-headline-md font-headline-md text-error font-bold">UNGROUNDED</h3>
          <span class="px-sm py-0.5 rounded-full bg-error text-on-error text-label-caps font-label-caps">REVIEW</span>
        </div>
        <p class="text-body-md text-on-error-container">${isResp ? "Response is unsupported as a whole" : `${d.unsupported_count} of ${d.sentence_count} sentence(s) unsupported`} · weakest support
          <span class="font-code-md font-bold">${d.weakest_score} / 100</span></p>
      </div></div>`;
  }

  function sentenceCard(s, granularity) {
    const ok = s.supported;
    const pill = ok
      ? `<span class="bg-[#e7f5ed] text-[#00714d] px-sm py-0.5 rounded text-label-caps font-label-caps border border-[#00714d]/10">Supported</span>`
      : `<span class="bg-[#fde8e8] text-[#93000a] px-sm py-0.5 rounded text-label-caps font-label-caps border border-[#93000a]/10">Unsupported</span>`;
    const scoreColor = ok ? "text-secondary" : "text-error";
    const barColor = ok ? "bg-secondary" : "bg-error";
    const stripe = ok ? "border-l-4 border-secondary" : "border-l-4 border-error";
    // In response granularity the whole answer is one unit, so a single "best match"
    // sentence can't represent it — hide it (only response-level metrics are meaningful).
    const bestMatch = (granularity !== "response" && s.best_document_sentence)
      ? `<div class="flex gap-xs items-start mt-xs">
           <span class="text-label-caps font-label-caps text-on-surface-variant shrink-0">BEST MATCH:</span>
           <span class="text-body-sm text-on-surface-variant italic">"${esc(s.best_document_sentence)}"</span></div>` : "";
    const w = Math.max(0, Math.min(100, s.support_score));
    return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm ${stripe}">
      <div class="p-md flex flex-col gap-sm">
        <div class="flex justify-between items-start gap-md">
          <p class="text-body-md font-medium text-on-surface">"${esc(s.text)}"</p>
          <div class="flex flex-col items-end gap-1 shrink-0">${pill}
            <span class="font-code-sm text-code-sm ${scoreColor} font-bold">${s.support_score}/100</span></div>
        </div>
        <div class="h-1 w-full bg-surface-container-low rounded-full overflow-hidden">
          <div class="h-full ${barColor}" style="width:${w}%"></div></div>
        ${bestMatch}
      </div></div>`;
  }

  function feedbackBlock(d) {
    if (!d.feedback) return "";
    return `<div class="bg-surface-container border border-outline-variant rounded-xl">
      <button class="w-full flex justify-between items-center p-md focus:outline-none" onclick="
        document.getElementById('fb').classList.toggle('hidden');
        this.querySelector('.arrow').classList.toggle('rotate-180');">
        <div class="flex items-center gap-sm">
          <span class="material-symbols-outlined text-primary">auto_fix_high</span>
          <span class="font-label-caps text-label-caps text-on-surface">Suggested revision feedback</span></div>
        <span class="material-symbols-outlined arrow transition-transform duration-300">expand_more</span>
      </button>
      <div id="fb" class="hidden p-md pt-0 border-t border-outline-variant bg-surface-container-low rounded-b-xl">
        <pre class="py-md text-body-sm text-on-surface-variant leading-relaxed whitespace-pre-wrap font-body-sm">${esc(d.feedback)}</pre>
      </div></div>`;
  }

  function render(d) {
    const cards = d.sentences.map(s => sentenceCard(s, d.granularity)).join("");
    resultsEl.innerHTML = `
      ${banner(d)}
      <div class="flex flex-col gap-md">
        <label class="text-label-caps font-label-caps text-on-surface-variant">GROUNDING BREAKDOWN</label>
        <div class="flex flex-col gap-md">${cards}</div>
      </div>
      ${feedbackBlock(d)}`;
  }

  resultsEl.innerHTML = initialState();

  $("checkBtn").onclick = async () => {
    const method = $("method").value;
    const body = {
      question: $("question").value,
      documents: $("documents").value,
      response: $("response").value,
      method,
      threshold: Number($("threshold").value),
      granularity: $("granularity").dataset.value
    };
    const slow = method !== "lexical";
    resultsEl.innerHTML = loadingState(slow ? "loading model weights (first run is slow)…" : "scoring locally…");
    $("checkBtn").disabled = true;
    try {
      const res = await fetch("/api/check", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { resultsEl.innerHTML = errorState(data.detail || "Request failed."); return; }
      render(data);
    } catch (e) {
      resultsEl.innerHTML = errorState("Could not reach the server: " + e.message);
    } finally {
      $("checkBtn").disabled = false;
    }
  };
</script>
</body></html>
